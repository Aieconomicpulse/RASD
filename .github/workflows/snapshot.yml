name: Daily data refresh
# Pulls the KSA platform's datasets into data/ksa at 06:15 Riyadh (03:15 UTC) and commits them,
# so the Vercel deploy (and the 06:30 cron) carries a fresh picture every morning.
on:
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node scripts/refresh-ksa-data.mjs
        env:
          KSA_BASE_URL: ${{ vars.KSA_BASE_URL || 'https://ksa-cpi-intelligence-v2-fh4f.vercel.app' }}
          KSA_BYPASS_TOKEN: ${{ secrets.KSA_BYPASS_TOKEN }}
      - run: |
          git config user.name "rasd-bot"
          git config user.email "rasd-bot@users.noreply.github.com"
          git add data/ksa
          git diff --cached --quiet || git commit -m "data: KSA refresh $(date -u +%F)"
          git push
