name: Deploy to Vercel
# Builds this repository and deploys it to the Vercel project "rasd" (team Economic pulse) on every push to main,
# and after the daily data refresh. Needs one repository secret: VERCEL_TOKEN (Vercel → Account settings → Tokens).
# Until that secret exists the job skips quietly.
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
concurrency:
  group: vercel-production
  cancel-in-progress: false
env:
  VERCEL_ORG_ID: team_lYHVPqiLv8ZcuhAjz29fC4OA
  VERCEL_PROJECT_ID: prj_pAsC8Fr4o7aM1NeEdTJRNKW7WWtr
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check for the Vercel token
        id: token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN is not set; add it under Settings → Secrets and variables → Actions to deploy automatically." >> "$GITHUB_STEP_SUMMARY"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'
        with: { ref: main }   # the tip of main, so a deploy called after the data refresh carries the new commit
      - uses: actions/setup-node@v4
        if: steps.token.outputs.present == 'true'
        with: { node-version: '22' }
      - name: Install the Vercel CLI
        if: steps.token.outputs.present == 'true'
        run: npm install --global vercel@latest
      - name: Pull the project settings
        if: steps.token.outputs.present == 'true'
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Build
        if: steps.token.outputs.present == 'true'
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Deploy
        if: steps.token.outputs.present == 'true'
        run: |
          url=$(vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")
          echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
